name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-api:
    name: Backend API CI (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./yatrasecure-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: yatrasecure-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint || true

      - name: Run Unit Tests
        run: npm run test -- --passWithNoTests

      - name: Build Application
        run: npm run build

  lint-and-test-web:
    name: Frontend Web CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./yatrasecure-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: yatrasecure-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint || true

      - name: Build Next.js Web App
        run: npm run build
